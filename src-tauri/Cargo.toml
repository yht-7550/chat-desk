[package]
name = "chatdesk"
version = "0.1.0"
description = "Desktop shell for a static web build"
authors = ["ChatDesk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chatdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
